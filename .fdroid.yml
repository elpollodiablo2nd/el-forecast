    versionCode: 1
    commit: HEAD
    subdir: android
    sudo: apt-get install -y openjdk-21-jdk-headless
    gradle:
      - yes
    prebuild: $$SDK$$/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
