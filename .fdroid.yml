Categories:
  - Market & Price
License: ISC
AuthorName: elpollodiablo2nd
WebSite: https://github.com/elpollodiablo2nd/el-forecast
SourceCode: https://github.com/elpollodiablo2nd/el-forecast
IssueTracker: https://github.com/elpollodiablo2nd/el-forecast/issues
Changelog: https://github.com/elpollodiablo2nd/el-forecast/releases

AutoName: elspot

RepoType: git
Repo: https://github.com/elpollodiablo2nd/el-forecast

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: HEAD
    subdir: android
    sudo:
      - apt-get install -y openjdk-21-jdk-headless
      - update-java-alternatives -s java-21-openjdk-amd64
    gradle:
      - yes
    prebuild: "SM=\"$(ls \"$$SDK$$\"/cmdline-tools/*/bin/sdkmanager \"$$SDK$$\"/tools/bin/sdkmanager
      2>/dev/null | head -n1)\"\ntest -n \"$SM\" || { echo \"sdkmanager not found
      under $$SDK$$\"; exit 1; }\n\"$SM\" \"platforms;android-36\" \"build-tools;36.0.0\"\
      \n"
    scanignore:
      - www/assets/timestral-5m.onnx
      - www/vendor/ort/ort-wasm-simd-threaded.wasm
      - models
      - android/gradle/wrapper/gradle-wrapper.jar
    gradleprops:
      - org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.0
CurrentVersionCode: 1
