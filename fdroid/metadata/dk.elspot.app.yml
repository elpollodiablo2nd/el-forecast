      test -n \"$SM\" || { echo \"sdkmanager not found under $$SDK$$\"; exit 1; }\n\
      \"$SM\" \"platforms;android-36\" \"build-tools;36.0.0\"\n"
    scanignore:
      - www/vendor/ort/ort-wasm-simd-threaded.wasm
      - android/app/src/main/assets/public/vendor/ort/ort-wasm-simd-threaded.wasm
    gradleprops:
      - org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64

