name: release-apk

# Builds the unsigned release APK on every v* tag (the same recipe F-Droid uses:
# committed android/ project, plain Gradle — see FDROID.md). F-Droid signs the APK
# itself; this artifact is for testing and GitHub-side distribution.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Use the preinstalled SDK on the runner and add current cmdline-tools
      # (android-actions/setup-android@v3 calls `sdkmanager tools`, which no
      # longer exists in new cmdline-tools).
      - name: Set up Android SDK cmdline-tools
        run: |
          SDK="/usr/local/lib/android/sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        run: ./tools/build-android-release.sh

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: elspot-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
