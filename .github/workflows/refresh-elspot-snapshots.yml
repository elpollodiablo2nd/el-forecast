name: refresh-elspot-snapshots

# Keeps the bundled elspot price snapshots fresh (every 3h) so the Android APK
# (which bundles www/assets/prices-*.json) always has recent + published-ahead
# day-ahead prices even when Energinet rate-limits end-user IPs.
# The refresh script falls back to the Nord Pool data-portal API if Energinet 429s.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh price snapshots (Energinet, Nord Pool fallback)
        run: python3 tools/fetch_prices_snapshot.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add www/assets elspot-dk2/assets
          if git diff --cached --quiet; then
            echo "snapshots unchanged, nothing to commit"
          else
            git commit -m "chore: refresh elspot price snapshots (DK1/DK2)"
            git push
          fi
